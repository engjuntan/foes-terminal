<body>
  <div class="scanlines"></div>

  <div id="login-screen" style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:black; z-index:9999; position:absolute; width:100%;">
    <h1 style="font-size: 40px; margin-bottom:10px;">> TERMINAL LOCKED</h1>
    <p style="color:var(--pip-dim); margin-bottom:20px;">AUTHORIZATION REQUIRED</p>
    
    <div class="console-input" style="width: 300px;">
       <span class="prompt">></span>
       <input type="text" id="loginInput" placeholder="ENTER PASSCODE..." autocomplete="off">
       <button id="loginBtn" style="background:transparent; border:none; color:lime; font-family:'VT323'; font-size:20px; cursor:pointer;">[ENTER]</button>
    </div>
  </div>

  <div id="app-interface" class="app-container hidden">
    
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-box">THE PROTIGA HELPER</div>
        <div class="status-indicator">v3.15</div>
      </div>

      <div id="game-clock" class="game-clock">DAY 1 · 08:00</div>

      <nav>
        <button id="btn-dashboard" class="nav-btn active" onclick="window.switchTab('DASHBOARD')">1. DASHBOARD</button>
        <button id="btn-quests" class="nav-btn" onclick="window.switchTab('QUESTS')">2. QUESTS</button>
        <button id="btn-logs" class="nav-btn" onclick="window.switchTab('DATA_LOGS')">3. DATA LOGS</button>
        <button id="btn-messages" class="nav-btn" onclick="window.switchTab('MESSAGES')">4. MESSAGES</button>
        <button id="btn-map" class="nav-btn" onclick="window.switchTab('MAPS')">5. MAPS</button>
        <button id="btn-checks" class="nav-btn" onclick="window.switchTab('CHECKS')">6. CHECKS</button>
        <button id="btn-workshop" class="nav-btn" onclick="window.switchTab('WORKSHOP')">7. WORKSHOP</button>
        <button id="btn-status" class="nav-btn" onclick="window.switchTab('STATUS')">8. STATUS</button>
        <button id="btn-admin" class="nav-btn hidden" style="border-color: red; color: red;">7. OVERRIDE</button>
      </nav>
      
      <div class="console-input">
        <span class="prompt">></span>
        <input type="text" id="cmdInput" placeholder="ENTER COMMAND..." autocomplete="off">
        <button id="cmdBtn" style="background:transparent; border:none; color:lime; font-family:'VT323'; font-size:20px;">[SEND]</button>
      </div>

      <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--pip-dim);">
        <span style="font-size:12px; color:var(--pip-dim);">TEXT SIZE</span>
        <button onclick="window.adjustFontScale(-0.1)" style="background:transparent; border:1px solid var(--pip-dim); color:lime; font-family:'VT323'; font-size:14px; cursor:pointer; padding:0 6px;">-</button>
        <span id="fontScaleDisplay" style="font-size:12px; min-width:36px; text-align:center;">100%</span>
        <button onclick="window.adjustFontScale(0.1)" style="background:transparent; border:1px solid var(--pip-dim); color:lime; font-family:'VT323'; font-size:14px; cursor:pointer; padding:0 6px;">+</button>
      </div>
    </aside>

    <main id="main-viewport">
      <h1>> INITIALIZING...</h1>
    </main>
  </div>

  <div id="wiki-overlay" class="hidden">
    <div class="wiki-window">
      <div class="wiki-header">
        <span>> ARCHIVE_RETRIEVAL_SYSTEM</span>
        <button onclick="window.closeWiki()" style="background:red; color:white; border:none; cursor:pointer;">[X]</button>
      </div>
      <iframe id="wiki-frame" src=""></iframe>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
